<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your guide is ready — Julie Chasen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Manrope', sans-serif;
    background: #eef3f7;
    color: #00263e;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #ffffff;
    max-width: 560px; width: 100%;
    padding: 56px 48px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 38, 62, 0.08);
  }
  .check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    background: #f5a800;
    border-radius: 50%;
    margin-bottom: 28px;
    color: #00263e;
    font-size: 30px; font-weight: 700;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: #007db4;
    margin-bottom: 14px; font-weight: 500;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 2.2rem;
    letter-spacing: -0.02em; line-height: 1.15;
    margin-bottom: 16px;
  }
  h1 em { color: #007db4; font-style: italic; }
  p { color: #4e738a; font-size: 1rem; margin-bottom: 12px; }
  .download {
    margin-top: 28px;
    display: inline-flex; align-items: center; gap: 10px;
    background: #f5a800; color: #00263e;
    padding: 16px 30px; border-radius: 999px;
    font-weight: 600; font-size: 1rem;
    text-decoration: none;
    transition: background 0.15s, transform 0.15s;
  }
  .download:hover { background: #ffc23d; transform: translateY(-1px); }
  .fallback {
    margin-top: 22px;
    font-size: 0.85rem; color: #6b8ba1;
  }
  .fallback a { color: #007db4; }
  .back {
    margin-top: 30px;
    display: inline-flex; align-items: center; gap: 8px;
    color: #4e738a;
    font-weight: 500; font-size: 0.92rem;
    text-decoration: none;
    transition: color 0.15s;
  }
  .back:hover { color: #00263e; }
  .back .arrow { transition: transform 0.2s; }
  .back:hover .arrow { transform: translateX(-3px); }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <span class="eyebrow">Guide unlocked</span>
    <h1>Your guide is <em>ready</em>.</h1>
    <p>10 AI Prompts Every CRE &amp; Finance Pro Needs — copy-paste prompts for listings, outreach, investor updates, and LinkedIn posts.</p>

    <a class="download" href="https://juliechasen.com/files/10-ai-prompts-cre-finance.pdf" download>
      ↓ Download the PDF
    </a>

    <p class="fallback">
      Download didn't start?
      <a href="https://juliechasen.com/files/10-ai-prompts-cre-finance.pdf" target="_blank" rel="noopener">Open it in a new tab</a>.
    </p>

    <a href="https://juliechasen.com/" class="back"><span class="arrow">←</span> Back to juliechasen.com</a>
  </div>
</body>
</html>
